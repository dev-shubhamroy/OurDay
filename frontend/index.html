<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080D18" />
    <meta name="description" content="OurDay — Plan together. Stay in sync." />
    <title>OurDay — Plan together. Stay in sync.</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var p = localStorage.getItem('ourday:theme') || 'dark';
        var t = p === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : p;
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
